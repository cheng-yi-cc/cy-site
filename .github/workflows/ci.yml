name: PR 检查

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: 测试并构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 文章标题和摘要可能来自历史提交信息，必须保留完整历史。
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc
          pandoc --version

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 构建网站
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
